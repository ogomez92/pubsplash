# Cuts a GitHub Release on any v* tag push: an NSIS installer and portable ZIP
# from Windows, and a signed, notarized DMG from macOS.
#
# Can also be started by hand from the Actions tab ("Run workflow") against any
# branch, to test packaging without cutting a release: those runs skip the
# release step and attach the installer and ZIP to the run as artifacts instead.
# The manual button only appears while this trigger is on the default branch,
# and a branch can only be dispatched if its own copy of this file has it too.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The tag check is its own job because *both* platform jobs must be gated by
  # it. Left inside the Windows job it only stopped Windows: the macOS job runs
  # in parallel, so a tag that disagrees with Cargo.toml or a changelog still
  # holding entries under Unreleased would have failed the Windows half and gone
  # on to notarize and publish a DMG for a release that was never cut.
  #
  # A tag is the only thing that publishes, so it is the only thing that has to
  # agree with the tree. The tag names the artifacts (see the Zip and upload
  # steps) while the About box and the installer take their version from
  # Cargo.toml -- so a mismatch ships binaries that disagree with their own file
  # names. Manual runs have no tag and skip the check, which leaves this job a
  # checkout and nothing else.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag against Cargo.toml and the changelog
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$tag' is not vX.Y.Z"
            exit 1
          fi
          version="${tag#v}"
          # The first `version = "..."` in Cargo.toml is the package's own; the
          # dependency table comes later and must not be matched.
          manifest="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "(.*)"/\1/')"
          if [[ "$manifest" != "$version" ]]; then
            echo "::error::Tag '$tag' does not match Cargo.toml version '$manifest'"
            exit 1
          fi
          if ! grep -qE "^## +\[?${version//./\\.}\]?" changelog.md; then
            echo "::error::changelog.md has no '## $version' heading"
            exit 1
          fi
          # agents.md: entries live under Unreleased until a release moves them
          # into a version heading. Anything still there at tag time did not make
          # it into the release notes.
          leftovers="$(awk '/^## /{ inside = ($0 ~ /^## +Unreleased/) ; next } inside && /^[-*] /' changelog.md || true)"
          if [[ -n "$leftovers" ]]; then
            echo "::error::changelog.md still has entries under '## Unreleased':"
            echo "$leftovers"
            exit 1
          fi
          echo "Releasing $version"

  build:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Ninja
        run: choco install ninja -y

      # Before packaging, not after: a release that fails its own test suite
      # should never reach the packaging step, let alone the Releases page.
      - name: Run tests
        run: cargo test --all-targets

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      # Must run before packaging: both HTML files are bundled into the installer
      # as packager resources (see Cargo.toml), so they have to exist on disk
      # first. HTML rather than Markdown because Help > Open Readme and Help >
      # View Changelog hand these to the default browser.
      - name: Convert docs to HTML
        run: |
          npm install -g marked
          marked README.md -o readme.html
          marked changelog.md -o changelog.html
        shell: bash

      # Builds the exe via the configured before-packaging-command
      # (cargo build --release) and produces the NSIS installer in target/release.
      - name: Package installer
        run: cargo packager --release

      - name: Assemble portable ZIP
        shell: bash
        run: |
          mkdir bundle
          # Every user-facing binary — keep this list in step with the
          # `binaries` key in Cargo.toml. pubsplash.exe resolves its helpers as
          # siblings of itself, so a ZIP missing one breaks Tools > Sound Pack
          # Manager or the VST plugin scan. gen-help is a dev tool and is
          # deliberately left out. The default sound pack is embedded in the exe
          # at compile time, so there are no loose assets to copy.
          cp target/release/pubsplash.exe bundle/
          cp target/release/pubsplash-scan.exe bundle/
          cp target/release/pubsplash-soundpack.exe bundle/
          cp target/release/pubsplash-update.exe bundle/
          cp target/release/soundpack.exe bundle/
          cp readme.html bundle/
          cp changelog.html bundle/
          # How Pubsplash knows it is the portable build: it must replace its
          # own folder rather than run the installer, and keep its data in
          # user_data\ here rather than in %LOCALAPPDATA%. The installer's
          # $INSTDIR has an uninstall.exe and no marker; this has the marker and
          # no uninstaller. See src/update/install_kind.rs and src/data_dir.rs,
          # both of which read this file's presence only -- the text is for
          # whoever opens it.
          cat > bundle/portable.txt <<'EOF'
          This is the portable build of Pubsplash. Everything it needs is in this
          folder; nothing is installed and nothing is written to the registry.

          Move the whole folder wherever you like and run pubsplash.exe. Your
          settings, logs, crash dumps and recordings go in the user_data folder
          beside it, so the folder is the whole installation: carry it on a USB
          stick, copy it to another machine, or delete it, and nothing is left
          behind anywhere else. Updates replace the program files here and leave
          user_data alone.

          Saved passwords and API keys are the one exception. Windows encrypts
          them for the account that entered them, so on another machine or user
          account they read as blank and have to be entered again.

          Do not delete this file: Pubsplash reads it to tell a portable copy
          from an installed one, both when it updates itself and when it decides
          where to keep your settings.
          EOF

      - name: Zip bundle
        shell: pwsh
        run: Compress-Archive -Path bundle/* -DestinationPath "pubsplash-${{ github.ref_name }}.zip"

      # `debug = "line-tables-only"` in Cargo.toml's release profile puts a .pdb
      # beside each binary. Nothing needs them to run, so they stay out of both
      # the installer and the portable ZIP -- but a minidump from src/crash.rs
      # is only readable in our own frames with the .pdb the exe was built with,
      # and that exact build exists nowhere else once the runner is gone. So
      # they ship as their own asset, matched to the release by its tag.
      #
      # Globbed rather than listed: cargo names a .pdb after the crate, not the
      # binary (pubsplash-scan.exe -> pubsplash_scan.pdb), and dependency PDBs
      # live under target/release/deps, not here.
      - name: Zip debug symbols
        shell: pwsh
        run: Compress-Archive -Path target/release/*.pdb -DestinationPath "pubsplash-${{ github.ref_name }}-debug-symbols.zip"

      # Everything the updater and the README's download links reach for lives at
      # `releases/latest/download/<name>`, which only works if the name has no
      # version in it. So each artifact is *copied*, not renamed: the versioned
      # name stays for humans and for telling one downloaded file from another,
      # and the stable copy beside it is what the fixed URLs resolve to. A few
      # megabytes of release storage per tag buys a link that never has to be
      # edited again.
      #
      # The debug-symbols ZIP deliberately gets no stable name: nothing should be
      # able to fetch it by guessing, and it is matched to a release by its tag.
      - name: Copy artifacts to stable names
        shell: bash
        run: |
          set -euo pipefail
          cp target/release/*-setup.exe pubsplash-setup.exe
          cp "pubsplash-${GITHUB_REF_NAME}.zip" pubsplash-portable.zip

      # The manifest Pubsplash reads to decide whether an update exists. Written
      # here rather than read from the GitHub API because api.github.com is rate
      # limited per IP -- which a shared or NAT'd network exhausts through no
      # fault of the user -- and because the API cannot carry a checksum. The
      # SHA-256s are what make a truncated or tampered download detectable before
      # anything is run; see src/update/http.rs, which verifies size then hash.
      #
      # `version` has no `v`: it is compared against CARGO_PKG_VERSION. Manual
      # runs have no tag, so they get the manifest version from Cargo.toml and
      # the notes URL from the branch -- enough to eyeball the file, and never
      # published.
      - name: Write latest.json
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            $version = $tag.Substring(1)
          } else {
            $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          }
          function Describe($path) {
            $item = Get-Item $path
            return [ordered]@{
              name   = $item.Name
              sha256 = (Get-FileHash $path -Algorithm SHA256).Hash.ToLower()
              size   = $item.Length
            }
          }
          $manifest = [ordered]@{
            version   = $version
            notes_url = "https://github.com/${{ github.repository }}/releases/tag/$tag"
            installer = Describe "pubsplash-setup.exe"
            portable  = Describe "pubsplash-portable.zip"
          }
          $manifest | ConvertTo-Json -Depth 4 | Out-File latest.json -Encoding utf8
          Get-Content latest.json

      # Manual runs stop here: the build is downloadable from the run's summary
      # page for 90 days, and nothing is published. The `pubsplash-*.zip` glob
      # here and in the release step covers the debug-symbols ZIP and the two
      # portable ones. latest.json is included so a manual run can be checked --
      # download it and confirm its hashes match the assets beside it.
      - name: Upload artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: pubsplash-${{ github.ref_name }}
          path: |
            target/release/*-setup.exe
            pubsplash-*.zip
            pubsplash-setup.exe
            latest.json

      # The release page's "what's new" is the changelog section for this tag,
      # not a list of commits: changelog.md is already written for users, and
      # `notes_url` in latest.json above points the in-app update prompt at this
      # very page, so whatever lands here is what an updating user reads.
      #
      # The heading pattern is the one the check step at the top of this file
      # enforces, so a tag that got this far has a section to extract; the empty
      # check below is for the case where the two drift apart anyway. The
      # section ends at the next `## ` heading -- awk exits there rather than
      # falling through to the older versions underneath.
      - name: Extract the release notes from the changelog
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # Compared as a whole token rather than by regex: the version is
          # interpolated from the tag, and `.` in a pattern would match anything
          # (so `0.1.1` would also accept a `0x1y1` heading), while escaping it
          # into an `awk -v` value runs into that assignment's own backslash
          # handling. `$2` is the version token whether the heading is written
          # `## 0.1.6` or `## [0.1.6]`.
          awk -v want="$version" '
            /^## / {
              if (found) exit
              h = $2
              gsub(/^\[|\]$/, "", h)
              found = (h == want)
              next
            }
            found { print }
          ' changelog.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "::error::changelog.md has no section body for $version"
            exit 1
          fi
          cat release-notes.md

      # Guarded on the ref rather than the event so this can only ever publish
      # from a tag, however the workflow was started.
      #
      # `body_path` and `generate_release_notes` are not alternatives: the
      # action appends the generated "What's Changed"/"New Contributors"/compare
      # links *after* the body, so the release page reads as the changelog first
      # and the commit-level detail second.
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/*-setup.exe
            pubsplash-*.zip
            pubsplash-setup.exe
            latest.json
          body_path: release-notes.md
          generate_release_notes: true

  # macOS. A separate job rather than a matrix leg because almost nothing is
  # shared: no NSIS, no portable layout (macOS has one data location -- see
  # CLAUDE.md), no updater, and a signing and notarization dance Windows has no
  # equivalent of.
  #
  # `macos-14` is the first arm64 runner, and arm64 is what Pubsplash needs: the
  # Core Audio process taps an Application source is built on arrived in 14.4.
  macos:
    needs: validate
    runs-on: macos-14
    # At job level, not per step. A step's own `env:` is not yet in scope when
    # its `if:` is evaluated, so `if: env.APPLE_CERTIFICATE != ''` on a step that
    # defines it would always be false -- signing would silently never run.
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Ninja
        run: brew install ninja

      - name: Run tests
        run: cargo test

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      # Both are bundled as packager resources (see Cargo.toml) and so must
      # exist before packaging, exactly as on Windows.
      - name: Convert docs to HTML
        run: |
          npm install -g marked
          marked README.md -o readme.html
          marked changelog.md -o changelog.html

      # The certificate is imported into a throwaway keychain rather than the
      # login one, so nothing survives the runner and no prompt can appear.
      # Skipped entirely when the secret is absent: a fork should still be able
      # to build a bundle, it just gets an unsigned one.
      - name: Import the signing certificate
        if: env.APPLE_CERTIFICATE != ''
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          PASSWORD="$(uuidgen)"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      # cargo-packager reads the signing identity and the notarization
      # credentials from the environment; see assets/macos/README.md for what
      # each secret is. With none of them set it builds an unsigned bundle and
      # says so, which is what keeps packaging testable on a fork.
      - name: Package app and DMG
        run: cargo packager --release --formats app,dmg --verbose

      # Proof rather than hope. An unsigned or wrongly-entitled bundle packages
      # perfectly happily and then fails on a user's machine, so the two things
      # that would do that are asserted here: the hardened runtime, without which
      # notarization is refused, and library validation being off, without which
      # no third-party VST3 plugin can load at all.
      - name: Check the bundle
        run: |
          set -euo pipefail
          APP=target/release/pubsplash.app
          codesign -dv --entitlements - "$APP" 2>&1 | tee /tmp/sig.txt
          if [[ -n "${APPLE_SIGNING_IDENTITY:-}" ]]; then
            grep -q "flags=.*runtime" /tmp/sig.txt \
              || { echo "::error::the bundle is not hardened; notarization would refuse it"; exit 1; }
            grep -q "com.apple.security.cs.disable-library-validation" /tmp/sig.txt \
              || { echo "::error::library validation is on; VST3 plugins would not load"; exit 1; }
            spctl --assess --type execute --verbose "$APP"
          else
            echo "::warning::No signing identity: this bundle is unsigned and cannot be distributed."
          fi

      # Stapling puts the notarization ticket inside the DMG, so Gatekeeper can
      # check it with no network. Without it a first launch on a machine that is
      # offline -- or behind a captive portal -- is refused.
      - name: Staple the notarization ticket
        if: env.APPLE_ID != ''
        run: xcrun stapler staple target/release/*.dmg

      - name: Name the DMG for the release
        shell: bash
        run: |
          set -euo pipefail
          # One stable name beside the versioned one, for the same reason the
          # Windows artifacts get one: releases/latest/download/<name> has to
          # resolve forever.
          cp target/release/*.dmg "pubsplash-${GITHUB_REF_NAME:-dev}-macos-arm64.dmg"
          cp target/release/*.dmg pubsplash-macos-arm64.dmg

      - name: Upload artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: pubsplash-macos-${{ github.ref_name }}
          path: pubsplash*-macos-arm64.dmg

      - name: Add the DMG to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pubsplash*-macos-arm64.dmg
