<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__BRAND__</title>
    <!--
      The room picker. Deliberately not a directory: a room exists because
      somebody opened it, and listing them would turn a private show's URL into
      a public one. Type the name you were given, or follow the link you were
      sent.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7f9;
        --panel: #ffffff;
        --ink: #16191d;
        --muted: #5a6270;
        --line: #d6dae1;
        --accent: #1a5fb4;
        --accent-ink: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101215;
          --panel: #181b20;
          --ink: #e8eaed;
          --muted: #a6adb9;
          --line: #2c3138;
          --accent: #6ea8fe;
          --accent-ink: #0b1020;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem 1rem;
        background: var(--bg);
        color: var(--ink);
        font: 1rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        width: min(28rem, 100%);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 0.75rem;
        padding: 1.5rem;
      }
      h1 {
        margin: 0 0 0.25rem;
        font-size: 1.375rem;
      }
      p.lead {
        margin: 0 0 1.25rem;
        color: var(--muted);
      }
      label {
        display: block;
        font-size: 0.875rem;
        color: var(--muted);
        margin-bottom: 0.25rem;
      }
      input {
        font: inherit;
        width: 100%;
        color: var(--ink);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 0.375rem;
        padding: 0.5rem 0.625rem;
      }
      .hint {
        margin: 0.375rem 0 1rem;
        font-size: 0.8125rem;
        color: var(--muted);
      }
      button {
        font: inherit;
        font-weight: 600;
        width: 100%;
        background: var(--accent);
        color: var(--accent-ink);
        border: 1px solid transparent;
        border-radius: 0.375rem;
        padding: 0.6rem 1rem;
        cursor: pointer;
      }
      :where(button, input):focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      .error {
        margin: 0.75rem 0 0;
        color: var(--ink);
        font-weight: 600;
      }
      .error:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>__BRAND__</h1>
      <p class="lead">Open the chat room you were given the name of.</p>
      <form id="go">
        <label for="room">Room name</label>
        <input id="room" name="room" autocomplete="off" aria-describedby="room-hint" required />
        <p class="hint" id="room-hint">
          Letters, digits, hyphens and underscores. For example, a room called
          nightowl is at /r/nightowl.
        </p>
        <button type="submit">Open chat</button>
        <p class="error" id="error" role="alert" aria-live="assertive"></p>
      </form>
    </main>
    <script>
      "use strict";
      const form = document.getElementById("go");
      const room = document.getElementById("room");
      const error = document.getElementById("error");
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        // The same rule the server applies, so a bad name is refused here with
        // an explanation rather than at the far end with a bare 404.
        const name = room.value.trim().toLowerCase();
        if (!/^[a-z0-9_-]{1,64}$/.test(name)) {
          error.textContent =
            "That name will not work. Use 1 to 64 letters, digits, hyphens or underscores.";
          room.focus();
          return;
        }
        location.href = `/r/${encodeURIComponent(name)}`;
      });
      room.focus();
    </script>
  </body>
</html>
